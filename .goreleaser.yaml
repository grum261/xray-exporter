# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: xray-exporter

builds:
  - main: ./cmd/xray-exporter
    binary: xray-exporter
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/grum261/xray-exporter/internal/version.version={{ .Version }}
      - -X github.com/grum261/xray-exporter/internal/version.revision={{ .FullCommit }}
      - -X github.com/grum261/xray-exporter/internal/version.commitDate={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, freebsd]
    goarch: [amd64, arm64, arm]
    goarm: ["6", "7"]
    ignore:
      - goos: darwin
        goarch: arm
      - goos: freebsd
        goarch: arm

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}-{{ .Version }}.{{ .Os }}-{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}
    wrap_in_directory: true
    files:
      - LICENSE
      - README.md
      - deploy/*

checksum:
  name_template: sha256sums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other changes
      order: 999
  filters:
    exclude:
      - "^docs"
      - "^test"
      - "^ci"
      - "^chore"

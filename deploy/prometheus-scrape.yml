# Scrape job for xray-exporter. Add it under scrape_configs in prometheus.yml.
# Replace the target with the address the exporter listens on
# (--web.listen-address); the bundled systemd unit binds to 127.0.0.1:9356.

scrape_configs:
  - job_name: "xray"
    static_configs:
      - targets: ["127.0.0.1:9356"]
        # Optional: a friendly instance name shown in the Grafana dashboard's
        # "Instance" selector instead of host:port.
        # labels:
        #   instance: "vpn-gateway"

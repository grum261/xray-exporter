# golangci-lint v2 configuration.
version: "2"
run:
  timeout: 3m

linters:
  enable:
    - errcheck
    - govet
    - gochecknoinits
    - nakedret
    - funlen
    - gocyclo
    - gocognit
    - dupl
    - mnd
    - lll
    - godot
    - nolintlint
    - bodyclose
    - noctx
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unused
  settings:
    funlen:
      lines: 300
      statements: 200
    gocyclo:
      min-complexity: 30
    gocognit:
      min-complexity: 30
    lll:
      line-length: 200
    govet:
      enable:
        - shadow
    dupl:
      threshold: 150
    godot:
      scope: declarations
    mnd:
      ignored-functions:
        - prometheus.NewDesc
        - prometheus.BuildFQName
  exclusions:
    rules:
      # Test files relax some rules.
      - path: _test\.go
        linters:
          - funlen
          - dupl
          - mnd
          - lll
          - gocognit
          - revive
          - govet
